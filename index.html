<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14532d"><title>Keuangan RT</title>
<style>
:root{--green:#14532d;--green2:#166534;--bg:#f3f6f4;--card:#fff;--ink:#17231b;--muted:#66736a;--line:#e3eae5;--red:#b42318;--blue:#1d4ed8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:84px}
header{background:linear-gradient(135deg,#14532d,#23834c);color:white;padding:22px 18px 24px;border-radius:0 0 24px 24px}
header small{opacity:.85}header h1{margin:5px 0;font-size:23px}header p{margin:0;opacity:.9;font-size:13px}
main{padding:15px;max-width:760px;margin:auto}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow:auto;z-index:5;padding:7px 4px calc(7px + env(safe-area-inset-bottom));}
.tabs button{flex:1;min-width:65px;border:0;background:none;color:#66736a;font-size:10px;padding:5px 2px}.tabs button span{display:block;font-size:19px;margin-bottom:2px}.tabs button.active{color:var(--green);font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:0 0 13px;box-shadow:0 3px 12px #183b2410}
h2{font-size:18px;margin:4px 0 14px}h3{font-size:15px;margin:0 0 9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f6faf7;border-radius:12px;padding:12px}.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:17px;margin-top:4px;overflow-wrap:anywhere}
label{display:block;font-size:12px;color:#536157;margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid #d6e0d9;border-radius:10px;padding:11px;background:#fff;font:inherit;color:var(--ink);min-height:43px}textarea{min-height:70px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--green);color:white;font-weight:700;font:inherit}.btn.secondary{background:#e8f2eb;color:var(--green)}.btn.danger{background:#fff0ef;color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:9px}.itemtop{display:flex;justify-content:space-between;gap:8px}.muted{color:var(--muted);font-size:12px}.amount{font-weight:800}.positive{color:#16803d}.negative{color:#b42318}.pill{font-size:11px;padding:4px 8px;border-radius:20px;background:#eef5ef;color:#27633a}.empty{text-align:center;color:var(--muted);padding:22px 8px}
.search{margin-bottom:8px}.hide{display:none!important}.note{font-size:12px;color:var(--muted);line-height:1.5}.receipt{border:1px dashed #9aa79e;padding:18px;border-radius:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header><small>APLIKASI PEMBUKUAN WARGA</small><h1 id="headTitle">Keuangan RT</h1><p id="headSub">Catat kas, iuran, dan laporan warga</p></header>
<main id="app"></main>
<nav class="tabs">
<button data-tab="home" class="active"><span>⌂</span>Beranda</button><button data-tab="warga"><span>♙</span>Warga</button><button data-tab="transaksi"><span>＋</span>Transaksi</button><button data-tab="iuran"><span>▤</span>Iuran</button><button data-tab="laporan"><span>▥</span>Laporan</button><button data-tab="lain"><span>☰</span>Lainnya</button>
</nav>
<script>
const KEY='keuangan_rt_mobile_v1';
const defaults={settings:{rt:'RT 001',rw:'RW 001',desa:'Isi nama desa/kelurahan',kecamatan:'Isi nama kecamatan',kota:'Isi nama kabupaten/kota',tahun:2026,saldo:0,bendahara:''},warga:[],transaksi:[]};
let db=load(),tab='home',editId=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function rup(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateNow(){return new Date().toISOString().slice(0,10)}
function monthNow(){return dateNow().slice(0,7)}
function id(prefix){return prefix+'-'+Date.now().toString().slice(-8)}
function active(){return db.warga.filter(w=>w.status!=='Nonaktif')}
function income(){return db.transaksi.filter(t=>t.jenis==='Pemasukan').reduce((a,t)=>a+Number(t.nominal||0),0)}
function expense(){return db.transaksi.filter(t=>t.jenis==='Pengeluaran').reduce((a,t)=>a+Number(t.nominal||0),0)}
function monthTotals(m){let a=db.transaksi.filter(t=>t.tanggal?.startsWith(m));return {in:a.filter(t=>t.jenis==='Pemasukan').reduce((s,t)=>s+ +t.nominal,0),out:a.filter(t=>t.jenis==='Pengeluaran').reduce((s,t)=>s+ +t.nominal,0)}}
const IN_CATS=['Iuran Warga','Sumbangan','Bantuan Pemerintah','Hasil Kegiatan','Lain-lain','Arisan Ngaji'];
const OUT_CATS=['Kebersihan','Keamanan','Listrik/Air','Perbaikan Lingkungan','Kegiatan Sosial','Administrasi','Lain-lain'];
const METHODS=['Tunai','Transfer','QRIS','Lainnya'];
function categoryBalances(year=db.settings.tahun){return IN_CATS.map(k=>{let rows=db.transaksi.filter(t=>String(t.tanggal||'').startsWith(String(year)));let masuk=rows.filter(t=>t.jenis==='Pemasukan'&&t.kategori===k).reduce((a,t)=>a+Number(t.nominal||0),0);let keluar=rows.filter(t=>t.jenis==='Pengeluaran'&&t.sumberDana===k).reduce((a,t)=>a+Number(t.nominal||0),0);return {kategori:k,masuk,keluar,saldo:masuk-keluar}})}

function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let s=db.settings;document.getElementById('headTitle').textContent=`${s.rt} / ${s.rw}`;document.getElementById('headSub').textContent=`${s.desa}, ${s.kecamatan}, ${s.kota}`;
let a=document.getElementById('app');a.innerHTML=({home:home,warga:wargaPage,transaksi:transaksiPage,iuran:iuranPage,laporan:laporanPage,lain:lainPage}[tab])();if(tab==='transaksi')categoryOptions()}
function home(){let m=monthNow(),mt=monthTotals(m);return `<div class="card"><h2>Ringkasan Keuangan</h2><div class="grid">
<div class="metric"><small>Saldo kas saat ini</small><strong>${rup(db.settings.saldo+income()-expense())}</strong></div><div class="metric"><small>Total pemasukan</small><strong class="positive">${rup(income())}</strong></div><div class="metric"><small>Total pengeluaran</small><strong class="negative">${rup(expense())}</strong></div><div class="metric"><small>KK aktif</small><strong>${active().length}</strong></div></div></div>
<div class="card"><h3>Ringkasan bulan ini (${m})</h3><div class="row"><div><small class="muted">Pemasukan</small><div class="amount positive">${rup(mt.in)}</div></div><div><small class="muted">Pengeluaran</small><div class="amount negative">${rup(mt.out)}</div></div></div></div>
<div class="card"><h3>Saldo kas per kategori · ${db.settings.tahun}</h3><p class="note">Pengeluaran mengurangi kategori sumber dana yang dipilih saat transaksi dicatat.</p>${categoryBalances().map(c=>`<div class="item"><div class="itemtop"><b>${esc(c.kategori)}</b><b class="${c.saldo<0?'negative':'positive'}">${rup(c.saldo)}</b></div><div class="muted">Pemasukan ${rup(c.masuk)} · Pengeluaran ${rup(c.keluar)}</div></div>`).join('')}</div>
<div class="card"><h3>Transaksi terbaru</h3>${db.transaksi.slice().sort((a,b)=>b.tanggal.localeCompare(a.tanggal)).slice(0,5).map(txItem).join('')||'<div class="empty">Belum ada transaksi.</div>'}</div>
<div class="card"><h3>Mulai gunakan</h3><p class="note">Tambahkan data warga terlebih dahulu, lalu catat pembayaran iuran dan transaksi kas. Data tersimpan di browser HP ini.</p><div class="actions"><button class="btn" onclick="go('warga')">+ Tambah warga</button><button class="btn secondary" onclick="go('transaksi')">+ Catat transaksi</button></div></div>`}
function go(t){tab=t;render()}
function wargaPage(){return `<div class="card"><h2>Data Warga / Kepala Keluarga</h2><input class="search" id="wSearch" placeholder="Cari nama atau alamat..." oninput="filterWarga()"><div id="wList">${wargaList(db.warga)}</div></div><div class="card"><h3 id="wFormTitle">Tambah Warga</h3><form onsubmit="saveWarga(event)"><input type="hidden" id="wId"><label>Nama kepala keluarga *</label><input id="wNama" required placeholder="Nama lengkap"><label>Alamat / Blok</label><input id="wAlamat" placeholder="Alamat"><div class="row"><div><label>No. HP</label><input id="wHp" inputmode="tel"></div><div><label>Iuran bulanan (Rp)</label><input id="wIuran" type="number" min="0" value="0" required></div></div><div class="row"><div><label>Tanggal bergabung</label><input id="wTanggal" type="date" value="${dateNow()}"></div><div><label>Status</label><select id="wStatus"><option>Aktif</option><option>Nonaktif</option></select></div></div><label>Nama anggota / penerima (opsional)</label><input id="wAnggota" placeholder="Nama anggota keluarga"><label>Catatan</label><input id="wCatatan"><div class="actions"><button class="btn" type="submit">Simpan warga</button><button class="btn secondary" type="reset" onclick="clearW()">Kosongkan</button></div></form></div>`}
function wargaList(arr){return arr.length?arr.map(w=>`<div class="item"><div class="itemtop"><b>${esc(w.nama)}</b><span class="pill">${esc(w.status)}</span></div><div class="muted">${esc(w.id)} · ${esc(w.alamat||'-')}${w.anggota?' · Anggota: '+esc(w.anggota):''}</div><div class="amount">${rup(w.iuran)} / bulan</div><div class="actions"><button class="btn secondary small" onclick="editW('${w.id}')">Edit</button><button class="btn danger small" onclick="delW('${w.id}')">Hapus</button></div></div>`).join(''):'<div class="empty">Belum ada data warga.</div>'}
function filterWarga(){let q=document.getElementById('wSearch').value.toLowerCase();document.getElementById('wList').innerHTML=wargaList(db.warga.filter(w=>(w.nama+w.alamat).toLowerCase().includes(q)))}
function saveWarga(e){e.preventDefault();let x={id:document.getElementById('wId').value||id('KK'),nama:wNama.value.trim(),alamat:wAlamat.value,hp:wHp.value,iuran:+wIuran.value,tanggal:wTanggal.value,status:wStatus.value,anggota:wAnggota.value,catatan:wCatatan.value};let i=db.warga.findIndex(w=>w.id===x.id);if(i>=0)db.warga[i]=x;else db.warga.push(x);save();render();alert('Data warga tersimpan.')}
function editW(x){let w=db.warga.find(a=>a.id===x);wId.value=w.id;wNama.value=w.nama;wAlamat.value=w.alamat;wHp.value=w.hp;wIuran.value=w.iuran;wTanggal.value=w.tanggal;wStatus.value=w.status;wCatatan.value=w.catatan;wAnggota.value=w.anggota||'';document.getElementById('wFormTitle').textContent='Edit Warga';window.scrollTo(0,document.body.scrollHeight)}
function clearW(){setTimeout(()=>{wId.value='';document.getElementById('wFormTitle').textContent='Tambah Warga'},0)}
function delW(x){if(confirm('Hapus data warga ini? Transaksi lama tidak ikut dihapus.')){db.warga=db.warga.filter(w=>w.id!==x);save();render()}}
function transaksiPage(){return `<div class="card"><h2>Catat Transaksi</h2><form onsubmit="saveTx(event)"><label>Tanggal *</label><input id="tTanggal" type="date" value="${dateNow()}" required><div class="row"><div><label>Jenis *</label><select id="tJenis" onchange="categoryOptions()"><option>Pemasukan</option><option>Pengeluaran</option></select></div><div><label>Kategori</label><select id="tKategori"></select></div></div><label id="sourceLabel" class="hide">Sumber dana (kategori pemasukan) *</label><select id="tSumber" class="hide"><option value="">— Pilih sumber dana —</option>${IN_CATS.map(x=>`<option>${x}</option>`).join('')}</select><label>Warga (khusus iuran)</label><select id="tWarga"><option value="">— Tidak terkait warga —</option>${db.warga.map(w=>`<option value="${esc(w.id)}">${esc(w.nama)} (${esc(w.id)})</option>`).join('')}</select><label>Periode iuran (YYYY-MM)</label><input id="tPeriode" type="month" value="${monthNow()}"><label>Uraian / keterangan *</label><input id="tUraian" required placeholder="Contoh: Bayar listrik bulan ini"><div class="row"><div><label>Nominal (Rp) *</label><input id="tNominal" type="number" min="1" required></div><div><label>Metode</label><select id="tMetode">${METHODS.map(x=>`<option>${x}</option>`).join('')}</select></div></div><label>Dicatat oleh</label><input id="tPencatat" value="${esc(db.settings.bendahara)}"><div class="actions"><button class="btn" type="submit">Simpan transaksi</button></div></form></div><div class="card"><h3>Riwayat Transaksi</h3><input class="search" id="txSearch" placeholder="Cari transaksi..." oninput="filterTx()"><div id="txList">${txList(db.transaksi)}</div></div>`}
function categoryOptions(){let inc=IN_CATS,out=OUT_CATS;tKategori.innerHTML=(tJenis.value==='Pemasukan'?inc:out).map(x=>`<option>${x}</option>`).join('');let exp=tJenis.value==='Pengeluaran';tSumber.classList.toggle('hide',!exp);sourceLabel.classList.toggle('hide',!exp);tSumber.required=exp}
function saveTx(e){e.preventDefault();if(tJenis.value==='Pengeluaran'&&!tSumber.value){alert('Pilih sumber dana kategori pemasukan.');return}let t={id:id('TRX'),tanggal:tTanggal.value,jenis:tJenis.value,kategori:tKategori.value,sumberDana:tJenis.value==='Pengeluaran'?tSumber.value:'',wargaId:tWarga.value,periode:tPeriode.value,uraian:tUraian.value,nominal:+tNominal.value,metode:tMetode.value,pencatat:tPencatat.value};db.transaksi.push(t);save();render();alert('Transaksi tersimpan. Saldo kategori sumber dana telah diperbarui.')}
function txItem(t){return `<div class="item"><div class="itemtop"><b>${esc(t.uraian)}</b><span class="amount ${t.jenis==='Pemasukan'?'positive':'negative'}">${t.jenis==='Pemasukan'?'+':'−'} ${rup(t.nominal)}</span></div><div class="muted">${esc(t.tanggal)} · ${esc(t.kategori)}${t.sumberDana?' · Dana: '+esc(t.sumberDana):''} · ${esc(t.metode)}${t.periode?' · '+esc(t.periode):''}</div><div class="actions"><button class="btn secondary small" onclick="receipt('${t.id}')">Kuitansi</button><button class="btn danger small" onclick="delTx('${t.id}')">Hapus</button></div></div>`}
function txList(arr){return arr.slice().sort((a,b)=>b.tanggal.localeCompare(a.tanggal)).map(txItem).join('')||'<div class="empty">Belum ada transaksi.</div>'}
function filterTx(){let q=document.getElementById('txSearch').value.toLowerCase();document.getElementById('txList').innerHTML=txList(db.transaksi.filter(t=>(t.uraian+t.kategori+t.tanggal).toLowerCase().includes(q)))}
function delTx(x){if(confirm('Hapus transaksi ini?')){db.transaksi=db.transaksi.filter(t=>t.id!==x);save();render()}}
function dues(){let m=document.getElementById('duesMonth')?.value||monthNow();return active().map(w=>{let paid=db.transaksi.filter(t=>t.jenis==='Pemasukan'&&t.kategori==='Iuran Warga'&&t.wargaId===w.id&&t.periode===m).reduce((s,t)=>s+t.nominal,0);return {...w,paid,left:Math.max(0,w.iuran-paid)}})}
function iuranPage(){let d=dues();return `<div class="card"><h2>Pemantauan Iuran</h2><label>Pilih periode</label><input id="duesMonth" type="month" value="${monthNow()}" onchange="render()"><div class="grid"><div class="metric"><small>Total tagihan</small><strong>${rup(d.reduce((s,w)=>s+w.iuran,0))}</strong></div><div class="metric"><small>Sudah dibayar</small><strong class="positive">${rup(d.reduce((s,w)=>s+w.paid,0))}</strong></div><div class="metric"><small>Tunggakan</small><strong class="negative">${rup(d.reduce((s,w)=>s+w.left,0))}</strong></div><div class="metric"><small>Belum lunas</small><strong>${d.filter(w=>w.left>0).length}</strong></div></div></div><div class="card"><h3>Status per warga</h3>${d.map(w=>`<div class="item"><div class="itemtop"><b>${esc(w.nama)}</b><span class="pill">${w.left===0?'Lunas':w.paid>0?'Sebagian':'Belum bayar'}</span></div><div class="muted">${esc(w.id)} · Tagihan ${rup(w.iuran)}</div><div class="muted">Dibayar ${rup(w.paid)} · Sisa <b class="negative">${rup(w.left)}</b></div><div class="actions"><button class="btn small" onclick="quickPay('${w.id}','${mEsc(document.getElementById('duesMonth')?.value||monthNow())}',${w.left})">Catat pembayaran</button></div></div>`).join('')||'<div class="empty">Belum ada warga aktif.</div>'}</div>`}
function mEsc(s){return s}
function quickPay(wid,m,left){if(left<=0){alert('Iuran periode ini sudah lunas.');return}let n=prompt('Masukkan nominal pembayaran (maksimal '+left+')',left);if(n===null)return;n=Number(n);if(!n||n<=0||n>left){alert('Nominal tidak valid.');return}let w=db.warga.find(x=>x.id===wid);db.transaksi.push({id:id('TRX'),tanggal:dateNow(),jenis:'Pemasukan',kategori:'Iuran Warga',wargaId:wid,periode:m,uraian:'Iuran '+w.nama+' periode '+m,nominal:n,metode:'Tunai',pencatat:db.settings.bendahara});save();render();alert('Pembayaran iuran dicatat.')}
function laporanPage(){let m=document.getElementById('reportMonth')?.value||monthNow(),v=monthTotals(m),awal=Number(db.settings.saldo)+db.transaksi.filter(t=>t.tanggal<m+'-01').reduce((s,t)=>s+(t.jenis==='Pemasukan'?1:-1)*t.nominal,0);return `<div class="card"><h2>Laporan Bulanan</h2><label>Pilih bulan</label><input id="reportMonth" type="month" value="${m}" onchange="render()"><div class="metric"><small>Saldo awal bulan</small><strong>${rup(awal)}</strong></div><div class="grid" style="margin-top:10px"><div class="metric"><small>Pemasukan</small><strong class="positive">${rup(v.in)}</strong></div><div class="metric"><small>Pengeluaran</small><strong class="negative">${rup(v.out)}</strong></div></div><div class="metric" style="margin-top:10px"><small>Saldo akhir bulan</small><strong>${rup(awal+v.in-v.out)}</strong></div><div class="actions"><button class="btn" onclick="exportReport('${m}')">Unduh laporan CSV</button></div></div><div class="card"><h3>Rekap kategori pemasukan · ${m}</h3>${IN_CATS.map(c=>{let n=db.transaksi.filter(t=>t.jenis==='Pemasukan'&&t.kategori===c&&t.tanggal.startsWith(m)).reduce((s,t)=>s+Number(t.nominal||0),0);return `<div class="item itemtop"><span>${c}</span><b>${rup(n)}</b></div>`}).join('')}</div><div class="card"><h3>Rekap kategori pengeluaran · ${m}</h3>${OUT_CATS.map(c=>{let n=db.transaksi.filter(t=>t.jenis==='Pengeluaran'&&t.kategori===c&&t.tanggal.startsWith(m)).reduce((s,t)=>s+Number(t.nominal||0),0);return `<div class="item itemtop"><span>${c}</span><b>${rup(n)}</b></div>`}).join('')}</div><div class="card"><h3>Pengeluaran berdasarkan sumber dana · ${m}</h3>${IN_CATS.map(c=>{let n=db.transaksi.filter(t=>t.jenis==='Pengeluaran'&&t.sumberDana===c&&t.tanggal.startsWith(m)).reduce((s,t)=>s+Number(t.nominal||0),0);return `<div class="item itemtop"><span>${esc(c)}</span><b>${rup(n)}</b></div>`}).join('')}</div><div class="card"><h3>Rincian transaksi bulan ${m}</h3>${txList(db.transaksi.filter(t=>t.tanggal.startsWith(m)))}</div>`}
function exportReport(m){let a=db.transaksi.filter(t=>t.tanggal.startsWith(m));download('laporan-'+m+'.csv','Tanggal,Jenis,Kategori,Sumber Dana,Uraian,Nominal,Metode\\n'+a.map(t=>[t.tanggal,t.jenis,t.kategori,t.sumberDana,t.uraian,t.nominal,t.metode].map(csv).join(',')).join('\\n'))}
function csv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function receipt(x){let t=db.transaksi.find(a=>a.id===x),w=db.warga.find(a=>a.id===t.wargaId);let win=window.open('','_blank');if(!win){alert('Izinkan pop-up untuk mencetak kuitansi.');return}win.document.write(`<html><head><title>Kuitansi</title><style>body{font:16px Arial;padding:28px}h2{text-align:center}.box{border:1px solid #555;padding:20px;max-width:500px;margin:auto}.line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #bbb}</style></head><body><div class="box"><h2>KUITANSI PEMBAYARAN</h2><p>${esc(db.settings.rt)} / ${esc(db.settings.rw)} · ${esc(db.settings.desa)}</p><div class="line"><span>No. Transaksi</span><b>${esc(t.id)}</b></div><div class="line"><span>Tanggal</span><b>${esc(t.tanggal)}</b></div><div class="line"><span>Diterima dari / terkait</span><b>${esc(w?.nama||'-')}</b></div><div class="line"><span>Keterangan</span><b>${esc(t.uraian)}</b></div><div class="line"><span>Nominal</span><b>${rup(t.nominal)}</b></div><div class="line"><span>Metode</span><b>${esc(t.metode)}</b></div>${t.sumberDana?`<div class="line"><span>Sumber Dana</span><b>${esc(t.sumberDana)}</b></div>`:'' }<p style="text-align:right;margin-top:40px">Bendahara,<br><br><br><b>${esc(db.settings.bendahara||'________________')}</b></p></div><script>window.print()<\/script></body></html>`);win.document.close()}
function lainPage(){let s=db.settings;return `<div class="card"><h2>Pengaturan RT/RW</h2><form onsubmit="saveSettings(event)"><label>Nama RT</label><input id="sRt" value="${esc(s.rt)}"><label>Nama RW</label><input id="sRw" value="${esc(s.rw)}"><label>Desa / Kelurahan</label><input id="sDesa" value="${esc(s.desa)}"><label>Kecamatan</label><input id="sKec" value="${esc(s.kecamatan)}"><label>Kabupaten / Kota</label><input id="sKota" value="${esc(s.kota)}"><div class="row"><div><label>Tahun laporan</label><input id="sTahun" type="number" value="${s.tahun}"></div><div><label>Saldo awal kas (Rp)</label><input id="sSaldo" type="number" value="${s.saldo}"></div></div><label>Nama bendahara</label><input id="sBendahara" value="${esc(s.bendahara)}"><div class="actions"><button class="btn">Simpan pengaturan</button></div></form></div>
<div class="card"><h3>Cadangkan & pulihkan data</h3><p class="note">Simpan backup secara berkala. Data hanya tersimpan di browser/perangkat ini. Jika browser dihapus atau HP berganti, pulihkan dari file backup.</p><div class="actions"><button class="btn" onclick="backup()">Unduh backup</button><label class="btn secondary" style="display:inline-block;margin:0">Pulihkan backup<input type="file" accept="application/json" hidden onchange="restore(event)"></label></div><div class="actions"><button class="btn secondary" onclick="exportWarga()">Ekspor data warga CSV</button><button class="btn danger" onclick="resetAll()">Hapus seluruh data</button></div></div>
<div class="card"><h3>Tentang aplikasi</h3><p class="note">Aplikasi mengikuti workbook terbaru: Dashboard, Pengaturan, Data Warga, Transaksi, Tagihan Iuran, Laporan Bulanan, dan Kuitansi. Termasuk kategori Arisan Ngaji serta rekap saldo setiap kategori pemasukan dan pengeluaran.</p></div>`}
function saveSettings(e){e.preventDefault();db.settings={rt:sRt.value,rw:sRw.value,desa:sDesa.value,kecamatan:sKec.value,kota:sKota.value,tahun:+sTahun.value,saldo:+sSaldo.value,bendahara:sBendahara.value};save();render();alert('Pengaturan disimpan.')}
function download(name,content,type='text/csv;charset=utf-8'){let b=new Blob(['\\ufeff'+content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function backup(){download('backup-keuangan-rt-'+dateNow()+'.json',JSON.stringify(db,null,2),'application/json')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.settings||!Array.isArray(x.warga)||!Array.isArray(x.transaksi))throw 0;if(confirm('Pulihkan backup? Data saat ini akan diganti.')){db=x;save();render();alert('Backup berhasil dipulihkan.')}}catch(z){alert('File backup tidak valid.')}};r.readAsText(f)}
function exportWarga(){download('data-warga.csv','ID KK,Nama,Alamat,No HP,Iuran Bulanan,Tanggal Bergabung,Status,Nama Anggota/Penerima,Catatan\\n'+db.warga.map(w=>[w.id,w.nama,w.alamat,w.hp,w.iuran,w.tanggal,w.status,w.anggota,w.catatan].map(csv).join(',')).join('\\n'))}
function resetAll(){if(confirm('Yakin hapus seluruh warga, transaksi, dan pengaturan? Unduh backup dulu jika diperlukan.')){db=structuredClone(defaults);save();render()}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
render();
</script></body></html>
